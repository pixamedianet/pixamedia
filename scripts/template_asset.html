<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{title}</title>
<meta name="description" content="{desc}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{url}">
<meta property="og:title" content="{title}">
<meta property="og:description" content="{desc}">
<meta property="og:image" content="{img}">
<meta property="og:url" content="{url}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{img}">
<style>body{{background:#0b0f19;color:#f3f4f6;font-family:system-ui,-apple-system,sans-serif;margin:0}}a{{color:#22d3ee;text-decoration:none}}a:hover{{color:#fff}}img{{max-width:100%}}</style>
{jsonld}
</head>
<body style="min-height:100vh">
<main style="max-width:960px;margin:0 auto;padding:24px 16px 48px">
  <nav aria-label="Breadcrumb" style="font-size:13px;color:#9ca3af;margin-bottom:20px"><a href="/">Home</a> &rsaquo; <a href="/category/{catslug}/">{cat}</a> &rsaquo; <span style="color:#e5e7eb">{title}</span></nav>
  <h1 style="font-size:26px;font-weight:800;line-height:1.3;margin:0 0 16px">{title}</h1>
  <a href="{img}" target="_blank" rel="noopener"><img src="{img}" alt="{title}" loading="lazy" width="1024" height="1024" style="width:100%;border-radius:16px;border:1px solid #1e293b;display:block"></a>
  <table style="width:100%;border-collapse:collapse;margin:20px 0;font-size:14px">
    <tr><td style="padding:8px;border-bottom:1px solid #1e293b;color:#9ca3af">Type</td><td style="padding:8px;border-bottom:1px solid #1e293b">{kind}</td></tr>
    <tr><td style="padding:8px;border-bottom:1px solid #1e293b;color:#9ca3af">Category</td><td style="padding:8px;border-bottom:1px solid #1e293b"><a href="/category/{catslug}/">{cat}</a></td></tr>
    <tr><td style="padding:8px;border-bottom:1px solid #1e293b;color:#9ca3af">Resolution</td><td style="padding:8px;border-bottom:1px solid #1e293b">{res}</td></tr>
    <tr><td style="padding:8px;color:#9ca3af">Date</td><td style="padding:8px">{date}</td></tr>
  </table>
  <a href="/category/{catslug}/" style="display:inline-block;background:linear-gradient(135deg,#22d3ee,#a855f7);color:#000;font-weight:800;padding:12px 22px;border-radius:12px">Download free</a>
  <p style="font-size:12px;color:#9ca3af;margin-top:20px;line-height:1.6">Free for YouTube, social media and personal projects, including monetized channels. Direct commercial use requires a VIP or API plan. No resale. See <a href="/terms">terms</a>.</p>
  <h2 style="font-size:18px;font-weight:700;margin:32px 0 12px">Similar {cat} images</h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">
    {similar}
  </div>
</main>
</body>
</html>
