name: Rebuild SEO pages
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pull latest (rebase on remote, avoid conflicts)
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/build_assets.py
      - run: python scripts/build_seo.py
      - run: python scripts/build_post.py
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "SEO: rebuild category pages (daily)"
            git push
          fi
      - name: Submit URLs to IndexNow
        run: |
          sleep 120
          python scripts/indexnow_submit.py
